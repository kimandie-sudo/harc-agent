<rect class="bg" width="760" height="360" rx="8"/>
<text x="24" y="40" class="t">공정 창 점수</text><text x="24" y="60" class="s">S4, 두 모델 평균 (정답 1 · 절반 0.5 · 오답 0)</text><line x1="58" x2="354" y1="262.0" y2="262.0" class="grid"/><text x="52" y="266.0" class="m" text-anchor="end">0.0</text><line x1="58" x2="354" y1="177.0" y2="177.0" class="grid"/><text x="52" y="181.0" class="m" text-anchor="end">0.5</text><line x1="58" x2="354" y1="92.0" y2="92.0" class="grid"/><text x="52" y="96.0" class="m" text-anchor="end">1.0</text><line x1="58" x2="354" y1="262" y2="262" class="base"/><text x="95.0" y="254" class="v" text-anchor="middle">0.00</text><text x="95.0" y="282" class="xl" text-anchor="middle">v3</text><text x="95.0" y="299" class="m" text-anchor="middle">정보 없음</text><path d="M157.0,262 V233.7 Q157.0,229.7 161.0,229.7 H177.0 Q181.0,229.7 181.0,233.7 V262 Z" class="bar"/><text x="169.0" y="221.7" class="v" text-anchor="middle">0.19</text><text x="169.0" y="282" class="xl" text-anchor="middle">v4</text><text x="169.0" y="299" class="m" text-anchor="middle">목표 입력</text><path d="M231.0,262 V233.7 Q231.0,229.7 235.0,229.7 H251.0 Q255.0,229.7 255.0,233.7 V262 Z" class="bar"/><text x="243.0" y="221.7" class="v" text-anchor="middle">0.19</text><text x="243.0" y="282" class="xl" text-anchor="middle">v5</text><text x="243.0" y="299" class="m" text-anchor="middle">제약 = 규칙</text><path d="M305.0,262 V175.89999999999998 Q305.0,171.89999999999998 309.0,171.89999999999998 H325.0 Q329.0,171.89999999999998 329.0,175.89999999999998 V262 Z" class="bar"/><text x="317.0" y="163.9" class="v" text-anchor="middle">0.53</text><text x="317.0" y="282" class="xl" text-anchor="middle">v5.1</text><text x="317.0" y="299" class="m" text-anchor="middle">우열 = 규칙</text>
<text x="406" y="40" class="t">설계 요구(AR &gt; 10)를 어긴 런</text><text x="406" y="60" class="s">모델이 고른 공정 창에 요구 미달 조건이 들어간 비율</text><line x1="440" x2="736" y1="262.0" y2="262.0" class="grid"/><text x="434" y="266.0" class="m" text-anchor="end">0%</text><line x1="440" x2="736" y1="177.0" y2="177.0" class="grid"/><text x="434" y="181.0" class="m" text-anchor="end">50%</text><line x1="440" x2="736" y1="92.0" y2="92.0" class="grid"/><text x="434" y="96.0" class="m" text-anchor="end">100%</text><line x1="440" x2="736" y1="262" y2="262" class="base"/><text x="477.0" y="254" class="v" text-anchor="middle">—</text><text x="477.0" y="282" class="xl" text-anchor="middle">v3</text><text x="477.0" y="299" class="m" text-anchor="middle">요구 미제공</text><path d="M539.0,262 V159.75 Q539.0,155.75 543.0,155.75 H559.0 Q563.0,155.75 563.0,159.75 V262 Z" class="bar"/><text x="551.0" y="147.8" class="v" text-anchor="middle">5/8</text><text x="551.0" y="282" class="xl" text-anchor="middle">v4</text><text x="625.0" y="254" class="v" text-anchor="middle">0/16</text><text x="625.0" y="282" class="xl" text-anchor="middle">v5</text><text x="699.0" y="254" class="v" text-anchor="middle">0/16</text><text x="699.0" y="282" class="xl" text-anchor="middle">v5.1</text>
<text x="24" y="328" class="m">v3→v5.1 은 파이프라인 판. 목표를 줘도(v4) 모델은 요구를 읽고 어겼고, 제약과 후보 간 우열을 규칙이 계산하자(v5·v5.1) 나아졌다.</text>
<text x="24" y="346" class="m">모델: Gemini 3.5 Flash-Lite · Gemma 4 26B. 판마다 8~16런, 한 시리즈의 사례다.</text>
