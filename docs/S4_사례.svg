<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="S4 사례: 공정 창 점수 v3 0.00, v4 0.19, v5 0.19, v5.1 0.53. 설계 요구 위반 런 v4 5/8, v5 0/16, v5.1 0/16.">
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--base:#c3c2b7;--s1:#2a78d6}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--base:#383835;--s1:#3987e5}}
.bg{fill:var(--surface)} .t{font:600 15px sans-serif;fill:var(--ink)} .s{font:12px sans-serif;fill:var(--ink2)}
.m{font:11px sans-serif;fill:var(--muted)} .xl{font:600 12px sans-serif;fill:var(--ink2)} .v{font:600 12px sans-serif;fill:var(--ink)}
.grid{stroke:var(--grid);stroke-width:1} .base{stroke:var(--base);stroke-width:1} .bar{fill:var(--s1)}
